name: Build Local Football 3D APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Check source files
        shell: bash
        run: |

          set -e

          echo "Checking Football 3D files..."

          test -f index.html
          test -f styles.css
          test -f game.js

          echo "index.html found"
          echo "styles.css found"
          echo "game.js found"

          echo "All source files OK"


      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/faizantedwa/football3d
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable


          cp index.html \
            app/src/main/assets/index.html

          cp styles.css \
            app/src/main/assets/styles.css

          cp game.js \
            app/src/main/assets/game.js


          cat > settings.gradle <<'EOF'

pluginManagement {

    repositories {

        google()
        mavenCentral()
        gradlePluginPortal()
    }
}


dependencyResolutionManagement {

    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )

    repositories {

        google()
        mavenCentral()
    }
}


rootProject.name = "Football3D"

include(":app")

EOF


          cat > build.gradle <<'EOF'

plugins {

    id 'com.android.application'
        version '8.7.3'
        apply false
}

EOF


          cat > app/build.gradle <<'EOF'

plugins {

    id 'com.android.application'
}


android {

    namespace 'com.faizantedwa.football3d'

    compileSdk 35


    defaultConfig {

        applicationId =
            'com.faizantedwa.football3d'

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName '1.0'
    }


    buildTypes {

        release {

            minifyEnabled false

        }
    }
}

EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'

<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowFullscreen">true</item>

        <item name="android:windowActionModeOverlay">true</item>

        <item name="android:colorAccent">#168cff</item>

    </style>

</resources>

EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'

<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">


    <application

        android:theme="@style/AppTheme"

        android:label="Local Football 3D"

        android:allowBackup="false"

        android:supportsRtl="true">


        <activity

            android:name=".MainActivity"

            android:screenOrientation="landscape"

            android:configChanges="orientation|screenSize|keyboardHidden"

            android:exported="true">


            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>


    </application>

</manifest>

EOF


          cat > app/src/main/java/com/faizantedwa/football3d/MainActivity.java <<'EOF'

package com.faizantedwa.football3d;


import android.app.Activity;

import android.os.Bundle;

import android.view.View;

import android.webkit.WebSettings;

import android.webkit.WebView;

import android.webkit.WebViewClient;


public class MainActivity
        extends Activity {


    private WebView webView;


    @Override
    protected void onCreate(
            Bundle savedInstanceState) {

        super.onCreate(
                savedInstanceState
        );


        getWindow()
                .setFlags(
                    android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                    android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                );


        webView =
            new WebView(this);


        WebSettings settings =
            webView.getSettings();


        settings.setJavaScriptEnabled(
            true
        );


        settings.setDomStorageEnabled(
            true
        );


        settings.setAllowFileAccess(
            true
        );


        settings.setAllowContentAccess(
            true
        );


        settings.setMediaPlaybackRequiresUserGesture(
            false
        );


        webView.setBackgroundColor(
            android.graphics.Color.BLACK
        );


        webView.setWebViewClient(
            new WebViewClient()
        );


        webView.setOverScrollMode(
            View.OVER_SCROLL_NEVER
        );


        setContentView(
            webView
        );


        webView.loadUrl(
            "file:///android_asset/index.html"
        );
    }


    @Override
    public void onBackPressed() {

        if (webView != null) {

            webView.evaluateJavascript(

                "(function(){"
                + "if(window.handleAndroidBack){"
                + "window.handleAndroidBack();"
                + "}"
                + "})()",

                null
            );

        } else {

            super.onBackPressed();
        }
    }
}

EOF


      - name: Verify generated project
        shell: bash
        run: |

          set -e

          echo "Verifying Android project..."

          test -f settings.gradle

          test -f build.gradle

          test -f app/build.gradle

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/faizantedwa/football3d/MainActivity.java

          test -f app/src/main/assets/index.html

          test -f app/src/main/assets/styles.css

          test -f app/src/main/assets/game.js

          echo "Android project verified."


      - name: Create Gradle wrapper
        shell: bash
        run: |

          set -e

          gradle wrapper \
            --gradle-version 8.9

          chmod +x gradlew


      - name: Build Debug APK
        shell: bash
        run: |

          set -e

          ./gradlew \
            --no-daemon \
            assembleDebug


      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created."

          ls -lh "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Local-Football-3D-APK

          path:
            app/build/outputs/apk/debug/app-debug.apk

          if-no-files-found: error

          retention-days: 7
